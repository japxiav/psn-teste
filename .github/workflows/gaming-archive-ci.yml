name: Gaming Archive security regression

on:
  push:
    branches:
      - main
      - audit/gaming-archive-regression-ci
  pull_request:
    paths:
      - 'gaming-archive/**'
      - '.github/workflows/gaming-archive-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaming-archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Identity and Cloud readiness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax-check captured modules
        run: |
          node --check gaming-archive/src/identity.mjs
          node --check gaming-archive/src/cloud-config.mjs
      - name: Run regression tests
        run: node --test gaming-archive/tests/*.test.mjs
